<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usage Dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pixel: "Silkscreen", monospace;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--sf);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    color: var(--text);
  }
  #root { height: 100vh; }

  /* ---------- THEME ---------- */
  .scene {
    position: relative; height: 100vh; width: 100vw; overflow: hidden;
    --text: #1d1d1f;
    --text2: rgba(40,40,46,0.82);
    --text3: rgba(50,50,56,0.58);
    --hairline: rgba(0,0,0,0.09);
    --panel-bg: rgba(250,250,252,0.66);
    --panel-edge: rgba(255,255,255,0.7);
    --card-bg: rgba(255,255,255,0.72);
    --card-bg-hover: rgba(255,255,255,0.92);
    --card-border: rgba(0,0,0,0.07);
    --menubar-bg: rgba(248,248,250,0.42);
    --track: rgba(0,0,0,0.10);
    --chip-bg: rgba(0,0,0,0.05);
    --shadow: 0 14px 40px rgba(20,20,40,0.20), 0 2px 8px rgba(20,20,40,0.10);
  }
  .scene[data-theme="dark"] {
    --text: #f5f5f7;
    --text2: rgba(238,238,246,0.82);
    --text3: rgba(232,232,242,0.56);
    --hairline: rgba(255,255,255,0.10);
    --panel-bg: rgba(28,28,32,0.58);
    --panel-edge: rgba(255,255,255,0.10);
    --card-bg: rgba(255,255,255,0.055);
    --card-bg-hover: rgba(255,255,255,0.10);
    --card-border: rgba(255,255,255,0.09);
    --menubar-bg: rgba(0,0,0,0.38);
    --track: rgba(255,255,255,0.13);
    --chip-bg: rgba(255,255,255,0.08);
    --shadow: 0 18px 50px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.35);
  }

  /* ---------- WALLPAPER ---------- */
  .wallpaper { position: absolute; inset: 0; }
  .scene[data-theme="light"] .wallpaper {
    background:
      radial-gradient(120% 90% at 12% 0%, #d7e7f7 0%, rgba(215,231,247,0) 55%),
      radial-gradient(120% 100% at 100% 100%, #f4ddcd 0%, rgba(244,221,205,0) 55%),
      linear-gradient(155deg, #c9def2 0%, #e3d6ef 48%, #f3e3d6 100%);
  }
  .scene[data-theme="dark"] .wallpaper {
    background:
      radial-gradient(120% 90% at 10% 0%, #34306a 0%, rgba(52,48,106,0) 55%),
      radial-gradient(120% 110% at 100% 100%, #3a2647 0%, rgba(58,38,71,0) 50%),
      linear-gradient(155deg, #20203f 0%, #1b2238 50%, #241a2e 100%);
  }
  .wallpaper::after { content: ""; position: absolute; inset: 0; background: radial-gradient(130% 120% at 50% 40%, transparent 60%, rgba(0,0,0,0.16) 100%); }

  /* desktop folder hint icons (very subtle, sells the desktop) */
  .desk-icons { position: absolute; top: 44px; left: 22px; display: flex; flex-direction: column; gap: 20px; opacity: 0.9; }
  .desk-ic { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; }
  .desk-ic .gly { width: 46px; height: 38px; border-radius: 8px; background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2)); border: 1px solid rgba(255,255,255,0.45); box-shadow: 0 3px 8px rgba(0,0,0,0.12); position: relative; }
  .scene[data-theme="dark"] .desk-ic .gly { background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)); border-color: rgba(255,255,255,0.18); }
  .desk-ic .gly::before { content: ""; position: absolute; top: -5px; left: 6px; width: 18px; height: 7px; border-radius: 4px 4px 0 0; background: inherit; }
  .desk-ic span { font: 11px var(--sf); color: rgba(255,255,255,0.92); text-shadow: 0 1px 2px rgba(0,0,0,0.35); }

  /* ---------- MENU BAR ---------- */
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 60;
    display: flex; align-items: center; gap: 18px; padding: 0 12px 0 14px;
    background: var(--menubar-bg);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    border-bottom: 0.5px solid var(--hairline);
    font-size: 13px; color: var(--text);
  }
  .menubar .brand-dot { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(140deg, #E8825C, #8C6DE2); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.4); }
  .menubar .mb-strong { font-weight: 700; letter-spacing: -0.1px; }
  .menubar .mb-item { color: var(--text); opacity: 0.86; }
  .menubar .mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar .mb-extra { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 0 2px; border-radius: 6px; }
  .menubar .mb-extra:hover { background: var(--chip-bg); }
  .menubar .mb-pct { font: 700 12px var(--sf); font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
  .menubar .mb-clock { font-variant-numeric: tabular-nums; letter-spacing: -0.1px; }

  /* ---------- DOCK PANEL ---------- */
  .dock {
    position: absolute; top: 26px; bottom: 0; right: 0; width: 336px; z-index: 50;
    display: flex; flex-direction: column;
    background: var(--panel-bg);
    -webkit-backdrop-filter: blur(34px) saturate(185%); backdrop-filter: blur(34px) saturate(185%);
    border-left: 0.5px solid var(--panel-edge);
    border-top-left-radius: 16px; border-bottom-left-radius: 16px;
    box-shadow: var(--shadow);
    transition: transform 0.46s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .dock.collapsed { transform: translateX(100%); }
  .scene.left .dock { right: auto; left: 0; border-left: none; border-right: 0.5px solid var(--panel-edge); border-radius: 0 16px 16px 0; }
  .scene.left .dock.collapsed { transform: translateX(-100%); }

  .dock-head { display: flex; align-items: center; padding: 15px 16px 11px; gap: 10px; }
  .dock-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .dock-sub { font-size: 11.5px; color: var(--text2); margin-top: 1px; }
  .dock-head .spacer { margin-left: auto; }
  .icon-btn { width: 28px; height: 28px; border-radius: 8px; border: none; background: transparent; color: var(--text2); display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.4s; }
  .icon-btn:hover { background: var(--chip-bg); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.spin svg { transform: rotate(360deg); transition: transform 0.6s ease; }

  .dock-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
  .dock-scroll::-webkit-scrollbar { width: 0; }

  .group-label { font: 600 10.5px var(--sf); letter-spacing: 0.6px; text-transform: uppercase; color: var(--text3); padding: 8px 6px 2px; }

  /* ---------- CARD ---------- */
  .card {
    background: var(--card-bg); border: 0.5px solid var(--card-border); border-radius: 15px;
    padding: 12px; cursor: pointer;
    transition: background 0.18s ease, transform 0.18s cubic-bezier(0.32,0.72,0,1), box-shadow 0.18s ease;
  }
  .card:hover { background: var(--card-bg-hover); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20,20,40,0.10); }
  .card-top { display: flex; align-items: center; gap: 11px; }
  .mascot-hold { width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center; position: relative; }
  .mascot-hold .activity { position: absolute; top: 1px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 0 rgba(52,199,89,0.5); animation: ping 1.6s infinite; }
  @keyframes ping { 0%{box-shadow:0 0 0 0 rgba(52,199,89,0.5);} 70%{box-shadow:0 0 0 6px rgba(52,199,89,0);} 100%{box-shadow:0 0 0 0 rgba(52,199,89,0);} }

  .card-id { flex: 1; min-width: 0; }
  .card-name { font-size: 14.5px; font-weight: 650; letter-spacing: -0.2px; display: flex; align-items: center; gap: 6px; }
  .acct-chip { font: 600 10px var(--sf); padding: 1.5px 6px; border-radius: 6px; background: var(--chip-bg); color: var(--text2); letter-spacing: 0.2px; }
  .reset-line { font-size: 12px; color: var(--text2); margin-top: 3px; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .mood-tag { font: 700 10px var(--sf); text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-top: 6px; display: inline-block; letter-spacing: 0.4px; }

  /* ring */
  .ring-hold { flex: 0 0 auto; position: relative; width: 50px; height: 50px; display: grid; place-items: center; }
  .ring-hold svg { transform: rotate(-90deg); }
  .ring-hold .ring-num { position: absolute; font-size: 13px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .ring-hold .ring-cap { position: absolute; bottom: -13px; left: 0; right: 0; text-align: center; font-size: 9.5px; color: var(--text2); letter-spacing: 0.2px; }

  /* expandable weekly */
  .card-detail { overflow: hidden; max-height: 0; transition: max-height 0.34s cubic-bezier(0.32,0.72,0,1), opacity 0.24s ease; opacity: 0; }
  .card.open .card-detail { max-height: 260px; opacity: 1; }
  .detail-inner { padding-top: 12px; margin-top: 11px; border-top: 0.5px solid var(--hairline); display: flex; flex-direction: column; gap: 11px; }
  .wk-row .wk-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 5px; }
  .wk-label { font-size: 12px; font-weight: 550; }
  .wk-val { font-size: 11.5px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .wk-bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .wk-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(0.32,0.72,0,1); }
  .wk-reset { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .dir-line { display: flex; align-items: center; gap: 6px; color: var(--text2); }
  .dir-line .fld { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }

  /* add provider */
  .add-card { display: flex; align-items: center; gap: 11px; padding: 13px 12px; border-radius: 15px; border: 1.4px dashed var(--card-border); background: transparent; color: var(--text2); cursor: pointer; transition: background 0.16s, border-color 0.16s, color 0.16s; }
  .add-card:hover { background: var(--chip-bg); border-color: var(--text3); color: var(--text); }
  .add-egg { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--chip-bg); }
  .add-egg svg { width: 20px; height: 20px; opacity: 0.7; }
  .add-txt b { font-size: 13.5px; font-weight: 650; display: block; }
  .add-txt span { font-size: 11px; color: var(--text3); }

  /* ---------- HANDLE + RAIL ---------- */
  .handle {
    position: absolute; top: 50%; left: -13px; transform: translateY(-50%);
    width: 26px; height: 54px; border-radius: 9px 4px 4px 9px; z-index: 2;
    background: var(--panel-bg); border: 0.5px solid var(--panel-edge); border-right: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    display: grid; place-items: center; cursor: pointer; color: var(--text2);
    box-shadow: -6px 0 16px rgba(20,20,40,0.10);
  }
  .scene.left .handle { left: auto; right: -13px; border-radius: 4px 9px 9px 4px; border-right: 0.5px solid var(--panel-edge); border-left: none; box-shadow: 6px 0 16px rgba(20,20,40,0.10); }
  .handle:hover { color: var(--text); }
  .handle svg { width: 13px; height: 13px; }

  .rail {
    position: absolute; top: 26px; bottom: 0; right: 0; width: 46px; z-index: 40;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 16px;
    background: var(--panel-bg); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
    border-left: 0.5px solid var(--panel-edge); border-top-left-radius: 14px; border-bottom-left-radius: 14px;
    box-shadow: var(--shadow); cursor: pointer;
    opacity: 0; transform: translateX(20px); pointer-events: none;
    transition: opacity 0.3s ease 0.12s, transform 0.4s cubic-bezier(0.32,0.72,0,1) 0.1s;
  }
  .scene.left .rail { right: auto; left: 0; border-left: none; border-right: 0.5px solid var(--panel-edge); border-radius: 0 14px 14px 0; transform: translateX(-20px); }
  .rail.show { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .rail .rail-chev { color: var(--text2); margin-bottom: 2px; }
  .rail .rail-chev svg { width: 14px; height: 14px; }
  .rail .rail-mini { width: 32px; height: 32px; display: grid; place-items: center; transition: transform 0.2s; }
  .rail:hover .rail-mini { transform: scale(1.08); }

  /* ---------- MASCOT MOTION ---------- */
  .mascot { display: inline-block; transform-origin: 50% 90%; will-change: transform; }
  .mascot-bob { animation: bob 2.8s ease-in-out infinite; }
  .mascot.busy { animation: bob 1.3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .mascot-hold:hover .mascot { animation: hop 0.5s cubic-bezier(0.3,1.4,0.5,1); }
  @keyframes hop { 0%{transform:translateY(0) scale(1,1);} 25%{transform:translateY(-9px) scale(0.94,1.08);} 55%{transform:translateY(0) scale(1.08,0.92);} 75%{transform:translateY(-2px) scale(0.98,1.02);} 100%{transform:translateY(0) scale(1,1);} }
  @media (prefers-reduced-motion: reduce) { .mascot-bob, .mascot.busy { animation: none; } }

  .fade-in { animation: fadeUp 0.5s cubic-bezier(0.32,0.72,0,1); }
  @keyframes fadeUp { from { transform: translateY(10px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
