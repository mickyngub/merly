name: CI

# Runs on pull requests (cheap insurance against a broken merge) and on demand
# from the Actions tab / `gh workflow run ci.yml`. Not on push: this repo is
# distributed as source that every user builds themselves, so a green run on
# main proves nothing a contributor's own `swift build` doesn't already tell
# them — but a PR gate catches breakage *before* it lands.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    # NOT macos-14: that runner ships Swift 5.10, which rejects code this project
    # builds fine against locally (default actor-isolation inference changed in
    # Swift 6.2+). CI was red for months over the mismatch alone. The macOS 14
    # *floor* is enforced by `.macOS(.v14)` in Package.swift — the compiler checks
    # API availability against the deployment target, not the runner's OS — so
    # building on a newer runner still proves Sonoma compatibility.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: scripts/bundle.sh
