name: CI

# Runs on pull requests (cheap insurance against a broken merge) and on demand
# from the Actions tab / `gh workflow run ci.yml`. Not on push: this repo is
# distributed as source that every user builds themselves, so a green run on
# main proves nothing a contributor's own `swift build` doesn't already tell
# them — but a PR gate catches breakage *before* it lands.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: scripts/bundle.sh
