name: CI

# Manual only — run it from the Actions tab, or `gh workflow run ci.yml`.
# Deliberately not on push/pull_request: this repo is distributed as source that
# every user builds themselves, so a green run here proves nothing a contributor's
# own `swift build` doesn't already tell them. It stays available for checking a
# clean-machine build before announcing a change.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Assemble app bundle
        run: scripts/bundle.sh
